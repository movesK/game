<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Mario - Web Edition</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family: Consolas, monospace; touch-action:none;
    display:flex; justify-content:center; align-items:center;
  }
  #wrap { position:relative; }
  canvas {
    display:block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .ctrl {
    position:fixed; bottom:16px; z-index:10;
    display:flex; gap:14px; user-select:none;
  }
  #left-group { left:16px; }
  #right-group { right:16px; }
  .btn {
    width:60px; height:60px; border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.5);
    color:#fff; font-size:24px; font-weight:bold;
    display:flex; justify-content:center; align-items:center;
    backdrop-filter: blur(2px);
  }
  .btn:active { background:rgba(255,255,255,0.4); }
  #hint {
    position:fixed; top:8px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.7); font-size:12px; z-index:10;
    pointer-events:none; white-space:nowrap;
  }
  @media (min-width: 900px) {
    .ctrl { display:none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">← → 移动　↑/空格 跳　R 重开</div>
<div class="ctrl" id="left-group">
  <div class="btn" id="btn-left">◀</div>
  <div class="btn" id="btn-right">▶</div>
</div>
<div class="ctrl" id="right-group">
  <div class="btn" id="btn-jump">A</div>
</div>

<script>
 
const PIXEL = 4;
const FPS = 60;
const VIEW_W = 200;
const VIEW_H = 160;
const GROUND_Y = 136;

const GRAVITY = 0.45;
const MAX_FALL = 8;
const RUN_ACCEL = 0.25;
const RUN_MAX = 1.8;
const RUN_MAX_FAST = 2.8;
const FRICTION = 0.85;
const JUMP_POWER = -7.8;
const JUMP_HOLD_BOOST = 0.22;
const JUMP_HOLD_FRAMES = 18;

const CANVAS_W = VIEW_W * PIXEL;
const CANVAS_H = VIEW_H * PIXEL;

  "t": "#c0c0c0",

const GOOMBA2 = [

  "...BBBBBBBB.....","....BBBBBB......","....B.B..B......","...BB.B..BB.....",
  "................","................","................","................",

const GOOMBA_FLAT = [

  "..BBBBBBBBBB....",".BBBBBBBBBBBB...","BBBBBBBBBBBBBB..","BBBBBBBBBBBBBB..",

  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
];
const PIPE_BODY = [
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",

const BRICK = [
  "OOOOOOOO","OoOoOoOo","OOOOOOOO","oOoOoOoO",

const QBLOCK = [

];
const COIN1 = [
  "..YYYY..",".YYYYYY.","YYY..YYY","YY....YY",
  "YY....YY","YYY..YYY",".YYYYYY.","..YYYY..",
];
const COIN2 = [
  "...YY...","..YYYY..","..Y..Y..","..Y..Y..",
  "..Y..Y..","..Y..Y..","..YYYY..","...YY...",
];
const MUSHROOM = [
  "..RRRR..",".RRRRRR.","RRWWRRWW","RWWRRWWR",
  "RRRRRRRR","RRRRRRRR",".SSSSSS.",".S.SS.S.",
];
const FLAG = [
  "..TTTT..","..TttT..","..TttT..","..TttT..","..TttT..","..TttT..",
  "..TttT..","..TttT..","..TttT..","..TttT..","..TttT..","..TttT..",
  "..TttT..","..TttT..","..TttT..","..TttT..",
];
const CLOUD = [
  "................",".....WWWW.......","...WWWWWWWW.....","..WWWWWWWWWW....",
  ".WWWWWWWWWWWW...","WWWWWWWWWWWWWW..","WWWWWWWWWWWWWW..","................",
];
const HILL = [
  "......GGGG......","....GGGGGGGG....","..GGGGGGGGGGGG..",".GGGGGGGGGGGGGG.",
  "GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG",
];
const BUSH = [
  "................","....GGGGGG......","..GGGGGGGGGG....",".GGGGGGGGGGGG...",
  "GGGGGGGGGGGGGG..","GGGGGGGGGGGGGG..",
];
const CASTLE = [
  "..BBBBBBBBBBBB..",".BBBBBBBBBBBBBB.","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
  "BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
  "BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
];

const LEVEL = [
  ["ground", 0, 2000],
  ["cloud", 20, 10], ["cloud", 90, 10], ["cloud", 160, 10],
  ["cloud", 250, 10], ["cloud", 340, 10], ["cloud", 430, 10],
  ["cloud", 520, 10], ["cloud", 610, 10],
  ["hill", 30, GROUND_Y - 8], ["hill", 200, GROUND_Y - 8],
  ["hill", 400, GROUND_Y - 8], ["hill", 600, GROUND_Y - 8],
  ["bush", 70, GROUND_Y - 6], ["bush", 260, GROUND_Y - 6],
  ["bush", 500, GROUND_Y - 6], ["bush", 700, GROUND_Y - 6],
  ["qblock", 16, GROUND_Y - 32],
  ["brick", 24, GROUND_Y - 32],
  ["qblock", 32, GROUND_Y - 32],
  ["brick", 40, GROUND_Y - 32],
  ["qblock", 48, GROUND_Y - 32],
  ["brick", 56, GROUND_Y - 32],
  ["brick", 80, GROUND_Y - 64],
  ["qblock", 88, GROUND_Y - 64],
  ["brick", 96, GROUND_Y - 64],
  ["pipe", 110, GROUND_Y - 16],
  ["pipe", 150, GROUND_Y - 32],
  ["pipe", 200, GROUND_Y - 16],
  ["pipe", 260, GROUND_Y - 48],
  ["goomba", 70, GROUND_Y - 10],
  ["goomba", 130, GROUND_Y - 10],
  ["goomba", 180, GROUND_Y - 10],
  ["goomba", 240, GROUND_Y - 10],
  ["goomba", 300, GROUND_Y - 10],
  ["goomba", 360, GROUND_Y - 10],
  ["coin", 26, GROUND_Y - 48],
  ["coin", 34, GROUND_Y - 48],
  ["coin", 42, GROUND_Y - 48],
  ["coin", 82, GROUND_Y - 80],
  ["coin", 90, GROUND_Y - 80],
  ["coin", 98, GROUND_Y - 80],
  ["coin", 320, GROUND_Y - 48],
  ["coin", 328, GROUND_Y - 48],
  ["coin", 336, GROUND_Y - 48],
  ["mushroom", 32, GROUND_Y - 32],
  ["brick", 380, GROUND_Y - 32],
  ["qblock", 388, GROUND_Y - 32],
  ["brick", 396, GROUND_Y - 32],
  ["brick", 404, GROUND_Y - 64],
  ["qblock", 412, GROUND_Y - 64],
  ["brick", 420, GROUND_Y - 64],
  ["goomba", 440, GROUND_Y - 10],
  ["goomba", 480, GROUND_Y - 10],
  ["brick", 520, GROUND_Y - 32],
  ["brick", 528, GROUND_Y - 32],
  ["brick", 536, GROUND_Y - 32],
  ["brick", 544, GROUND_Y - 32],
  ["brick", 552, GROUND_Y - 32],
  ["brick", 560, GROUND_Y - 32],
  ["brick", 568, GROUND_Y - 32],
  ["brick", 576, GROUND_Y - 32],
  ["flag", 640, GROUND_Y - 96],
  ["castle", 680, GROUND_Y - 48],
];

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

function fitCanvas() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;

  const maxW = winW - 20;
  const maxH = winH - (winW < 900 ? 120 : 20);
  const scale = Math.min(maxW / CANVAS_W, maxH / CANVAS_H);
  const dispW = Math.floor(CANVAS_W * scale);
  const dispH = Math.floor(CANVAS_H * scale);
  canvas.style.width = dispW + "px";
  canvas.style.height = dispH + "px";
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 200));
fitCanvas();

let keys = {};
let touchLeft = false, touchRight = false, touchJump = false;
let mario, camera_x, game_state, score, coins, lives, time_left, jump_timer;
let goomba_state, coin_state, block_state, mushroom_state;

function reset() {
  mario = {
    x: 20, y: GROUND_Y - 16, vx: 0, vy: 0,
    on_ground: true, big: false, facing: 1, invincible: 0, frame: 0,
  };
  camera_x = 0;
  game_state = "playing";
  score = 0;
  coins = 0;
  lives = 3;
  time_left = 400;
  jump_timer = 0;
  goomba_state = {};
  coin_state = {};
  block_state = {};
  mushroom_state = {};
  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "goomba") goomba_state[ix + "," + iy] = { alive: true, vx: -0.4, flat: 0 };
    if (kind === "coin") coin_state[ix + "," + iy] = true;
    if (kind === "brick" || kind === "qblock") block_state[ix + "," + iy] = { used: false, bump: 0 };
    if (kind === "mushroom") mushroom_state[ix + "," + iy] = { active: false, vx: 0.8, vy: 0, y: iy };
  }
}

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp", "Space", "KeyW"].includes(e.code) && mario.on_ground) {
    mario.vy = JUMP_POWER;
    mario.on_ground = false;
    jump_timer = 0;
  }
  if (e.code === "KeyR") reset();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyW", "KeyA", "KeyD"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function bindBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); onDown(); };
  const up = e => { e.preventDefault(); onUp(); };
  el.addEventListener("touchstart", down, { passive: false });
  el.addEventListener("touchend", up, { passive: false });
  el.addEventListener("touchcancel", up, { passive: false });
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
}
bindBtn("btn-left", () => touchLeft = true, () => touchLeft = false);
bindBtn("btn-right", () => touchRight = true, () => touchRight = false);
bindBtn("btn-jump", () => {
  touchJump = true;
  if (mario.on_ground) {
    mario.vy = JUMP_POWER;
    mario.on_ground = false;
    jump_timer = 0;
  }
}, () => touchJump = false);

function drawSprite(sprite, x, y, flip) {
  for (let r = 0; r < sprite.length; r++) {
    const row = sprite[r];
    for (let c = 0; c < row.length; c++) {
      const col = COLOR[row[c]];
      if (col) {
        const dc = flip ? (row.length - 1 - c) : c;
        const sx = Math.floor((x + dc - camera_x) * PIXEL);
        const sy = Math.floor((y + r) * PIXEL);
        if (sx > -PIXEL && sx < CANVAS_W && sy > -PIXEL && sy < CANVAS_H) {
          ctx.fillStyle = col;
          ctx.fillRect(sx, sy, PIXEL, PIXEL);
        }
      }
    }
  }
}

function drawRect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.floor((x - camera_x) * PIXEL), Math.floor(y * PIXEL),
               Math.floor(w * PIXEL), Math.floor(h * PIXEL));
}

function updateMario() {
  const m = mario;
  let ax = 0;
  const fast = keys["ShiftLeft"] || keys["ShiftRight"];
  const runMax = fast ? RUN_MAX_FAST : RUN_MAX;
  if (keys["ArrowLeft"] || keys["KeyA"] || touchLeft) { ax = -RUN_ACCEL; m.facing = -1; }
  if (keys["ArrowRight"] || keys["KeyD"] || touchRight) { ax = RUN_ACCEL; m.facing = 1; }
  m.vx += ax;
  if (ax === 0) {
    m.vx *= FRICTION;
    if (Math.abs(m.vx) < 0.05) m.vx = 0;
  }
  m.vx = Math.max(-runMax, Math.min(runMax, m.vx));

  if ((keys["ArrowUp"] || keys["Space"] || keys["KeyW"] || touchJump) && !m.on_ground) {
    if (jump_timer < JUMP_HOLD_FRAMES) {
      m.vy -= JUMP_HOLD_BOOST;
      jump_timer++;
    }
  }

  m.x += m.vx;
  m.vy = Math.min(m.vy + GRAVITY, MAX_FALL);
  m.y += m.vy;

  const mh = m.big ? 24 : 16;
  const mw = 14;

  if (m.y >= GROUND_Y - mh) {
    m.y = GROUND_Y - mh; m.vy = 0; m.on_ground = true;
  }

  for (const [kind, ix, iy] of LEVEL) {
    if (kind !== "brick" && kind !== "qblock") continue;
    if (m.x + mw > ix && m.x < ix + 8) {
      if (m.y + mh > iy && m.y + mh < iy + 14 && m.vy > 0) {
        m.y = iy - mh; m.vy = 0; m.on_ground = true;
      } else if (m.y < iy + 8 && m.y > iy - 4 && m.vy < 0) {
        m.y = iy + 8; m.vy = 0;
        const b = block_state[ix + "," + iy];
        if (kind === "qblock" && !b.used) {
          b.used = true; b.bump = 8;
          for (const mm of LEVEL) {
            if (mm[0] === "mushroom" && mm[1] === ix) {
              const mu = mushroom_state[mm[1] + "," + mm[2]];
              mu.active = true; mu.vy = -2;
            }
          }
          score += 200;
        } else if (kind === "brick") {
          b.bump = 8; score += 50;
        }
      }
    }
  }

  for (const [kind, ix, iy] of LEVEL) {
    if (kind !== "pipe") continue;
    if (m.x + mw > ix + 1 && m.x < ix + 13) {
      if (m.y + mh > iy && m.y + mh < iy + 8 && m.vy > 0) {
        m.y = iy - mh; m.vy = 0; m.on_ground = true;
      } else if (m.y + mh > iy + 4) {
        if (m.vx > 0) m.x = ix - mw;
        else if (m.vx < 0) m.x = ix + 14;
        m.vx = 0;
      }
    }
  }
}

function updateGoombas() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const [kind, ix, iy] of LEVEL) {
    if (kind !== "goomba") continue;
    const g = goomba_state[ix + "," + iy];
    if (!g.alive) { if (g.flat > 0) g.flat--; continue; }
    const gx = ix + g.vx;
    if (m.x + mw > gx && m.x < gx + 14 && m.y + mh > iy && m.y < iy + 14) {
      if (m.vy > 0 && m.y + mh < iy + 10) {
        g.alive = false; g.flat = 30;
        m.vy = -5; score += 100;
      } else {
        if (m.invincible <= 0) {
          if (m.big) { m.big = false; m.y += 8; m.invincible = 90; }
          else game_state = "dead";
        }
      }
    }
  }
}

function updateCoins() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const [kind, ix, iy] of LEVEL) {
    if (kind !== "coin") continue;
    if (!coin_state[ix + "," + iy]) continue;
    if (m.x + mw > ix && m.x < ix + 8 && m.y + mh > iy && m.y < iy + 8) {
      coin_state[ix + "," + iy] = false;
      coins++; score += 200;
    }
  }
}

function updateMushroom() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const [kind, ix, iy] of LEVEL) {
    if (kind !== "mushroom") continue;
    const mu = mushroom_state[ix + "," + iy];
    if (!mu.active) continue;
    mu.vy = Math.min(mu.vy + GRAVITY, MAX_FALL);
    mu.y += mu.vy;
    if (mu.y >= GROUND_Y - 8) { mu.y = GROUND_Y - 8; mu.vy = 0; }
    const mx = ix + mu.vx;
    if (m.x + mw > mx && m.x < mx + 8 && m.y + mh > mu.y && m.y < mu.y + 8) {
      mu.active = false;
      if (!m.big) { m.big = true; m.y -= 8; }
      score += 1000;
    }
  }
}

function checkFlag() {
  for (const item of LEVEL) {
    if (item[0] === "flag" && mario.x + 14 > item[1] + 2) game_state = "win";
  }
}

function render() {
  ctx.fillStyle = COLOR["C"];
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  for (const item of LEVEL) if (item[0] === "cloud") drawSprite(CLOUD, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === "hill") drawSprite(HILL, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === "bush") drawSprite(BUSH, item[1], item[2]);

  drawRect(0, GROUND_Y, VIEW_W + 40, VIEW_H - GROUND_Y, "#e39d25");
  drawRect(0, GROUND_Y, VIEW_W + 40, 2, "#a86b1a");

  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "brick") {
      const b = block_state[ix + "," + iy];
      drawSprite(BRICK, ix, iy - b.bump);
      if (b.bump > 0) b.bump--;
    } else if (kind === "qblock") {
      const b = block_state[ix + "," + iy];
      drawSprite(b.used ? QBLOCK_USED : QBLOCK, ix, iy - b.bump);
      if (b.bump > 0) b.bump--;
    }
  }

  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "pipe") {
      drawSprite(PIPE_TOP, ix, iy);
      let by = iy + 16;
      while (by < GROUND_Y) { drawSprite(PIPE_BODY, ix, by); by += 16; }
    }
  }

  const f = mario.frame;
  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "coin" && coin_state[ix + "," + iy]) {
      drawSprite((Math.floor(f / 8) % 2 === 0) ? COIN1 : COIN2, ix, iy);
    }
  }

  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "mushroom") {
      const mu = mushroom_state[ix + "," + iy];
      if (mu.active) drawSprite(MUSHROOM, ix + mu.vx, mu.y);
    }
  }

  for (const item of LEVEL) if (item[0] === "flag") drawSprite(FLAG, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === "castle") drawSprite(CASTLE, item[1], item[2]);

  for (const [kind, ix, iy] of LEVEL) {
    if (kind === "goomba") {
      const g = goomba_state[ix + "," + iy];
      if (g.alive) {
        drawSprite((Math.floor(f / 8) % 2 === 0) ? GOOMBA1 : GOOMBA2, ix + g.vx, iy);
      } else if (g.flat > 0) {
        drawSprite(GOOMBA_FLAT, ix, iy);
      }
    }
  }

  const m = mario;
  if (!(m.invincible > 0 && Math.floor(f / 4) % 2 === 0)) {
    let spr, flip = false;
    if (!m.on_ground) spr = MS_JUMP;
    else if (Math.abs(m.vx) > 0.3) spr = (Math.floor(f / 4) % 2 === 0) ? MS_RUN1 : MS_RUN2;
    else spr = MS_IDLE;
    flip = m.facing < 0;
    drawSprite(spr, m.x, m.y, flip);
  }

  ctx.fillStyle = "white";
  ctx.font = "bold 10px Consolas";
  ctx.textAlign = "left";
  ctx.fillText(`MARIO ${String(score).padStart(6, "0")}  x${String(coins).padStart(2, "0")}  TIME ${String(time_left).padStart(3, "0")}  LIVES ${lives}`, 6, 12);

  if (game_state === "win") {
    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Consolas";
    ctx.fillText("COURSE CLEAR!", CANVAS_W / 2, CANVAS_H / 2 - 20);
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 12px Consolas";
    ctx.fillText(`SCORE: ${score}  COINS: ${coins}`, CANVAS_W / 2, CANVAS_H / 2 + 10);
    ctx.fillStyle = "white";
    ctx.fillText("Press R / 刷新重开", CANVAS_W / 2, CANVAS_H / 2 + 35);
  } else if (game_state === "dead") {
    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Consolas";
    ctx.fillText("GAME OVER", CANVAS_W / 2, CANVAS_H / 2);
    ctx.font = "bold 12px Consolas";
    ctx.fillText("Press R / 刷新重开", CANVAS_W / 2, CANVAS_H / 2 + 30);
  }
}

let lastTime = 0, accumulator = 0;
const STEP = 1 / FPS;

function loop(t) {
  const dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt < 1 && dt > 0) {
    accumulator += dt;
    let safety = 0;
    while (accumulator >= STEP && safety < 5) {
      if (game_state === "playing") {
        updateMario();
        updateGoombas();
        updateCoins();
        updateMushroom();
        checkFlag();
        if (mario.invincible > 0) mario.invincible--;
        if (mario.y > VIEW_H + 50) game_state = "dead";
        const target = mario.x - VIEW_W * 0.4;
        camera_x += (target - camera_x) * 0.15;
        camera_x = Math.max(0, camera_x);
        if (mario.frame % 60 === 0 && time_left > 0) time_left--;
        mario.frame++;
      }
      accumulator -= STEP;
      safety++;
    }
  }
  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
