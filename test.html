<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Mario - HTML Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    font-family: Consolas, monospace;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    background: #5c94fc;
  }
  canvas { display: block; image-rendering: pixelated; }
  #mobile-controls {
    position: fixed; bottom: 20px; left: 0; right: 0;
    display: none; justify-content: space-between;
    padding: 0 20px; pointer-events: none;
  }
  #mobile-controls .btn {
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: 3px solid rgba(255,255,255,0.6);
    color: white; font-size: 28px; font-weight: bold;
    display: flex; justify-content: center; align-items: center;
    pointer-events: auto; user-select: none;
  }
  #mobile-controls .left-group { display: flex; gap: 15px; }
  #mobile-controls .right-group { display: flex; gap: 15px; }
  @media (max-width: 768px) {
    #mobile-controls { display: flex; }
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
</div>
<div id="mobile-controls">
  <div class="left-group">
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
  </div>
  <div class="right-group">
    <div class="btn" id="btn-jump">A</div>
  </div>
</div>

<script>

const PIXEL = 4;
const FPS = 60;
const VIEW_W = 200;
const VIEW_H = 160;
const GROUND_Y = 136;

const GRAVITY = 0.45;
const MAX_FALL = 8;
const RUN_ACCEL = 0.25;
const RUN_MAX = 1.8;
const FRICTION = 0.85;
const JUMP_POWER = -7.8;
const JUMP_HOLD_BOOST = 0.22;
const JUMP_HOLD_FRAMES = 18;

  'R': '#e52521', 'S': '#fbb78b', 'B': '#5c3317',
  'Y': '#ffd700', 'W': '#ffffff', 'K': '#000000',
  'G': '#00a800', 'g': '#007800', 'O': '#e39d25',
  'o': '#a86b1a', 'T': '#ffffff', 't': '#c0c0c0',
};

  "..BSBBSSSKSSS...","..BBSSSSKKKK....","....SSSSSSS.....","...RRBRRRR......",
  "..RRRBRRBRRR....",".RRRRBBBBRRRR...","..SRBYBBYBRS....","...SBBBBBBBS....",
  "..BBBBBBBBBB....",".BBB.BBB..BBB...","BB...BBB...BB...",".....BB.........",

const MS_RUN2 = [
  "....RRRRR.......","...RRRRRRRRR....","...BBBSSKS......","..BSBSSSKSSS....",
  "..BSBBSSSKSSS...","..BBSSSSKKKK....","....SSSSSSS.....","...RRBRRRR......",
  "..RRRBRRBRRR....",".RRRRBBBBRRRR...",".SSRBYBBYBRSS...",".SSSBBBBBBSSS...",

const GOOMBA1 = [

  "..BBWKBBWKBB....","..BBBBBBBBBB....","..BBBBBBBBBB....","..BBBBBBBBBB....",
  "...BBBBBBBB.....","....BBBBBB......","...B.B..B.B.....","..BB.B..B.BB....",

const GOOMBA2 = [

  "...BBBBBBBB.....","....BBBBBB......","....B.B..B......","...BB.B..BB.....",
  "................","................","................","................",
];
const GOOMBA_FLAT = [

  "................","................","................","................",
  "..BBBBBBBBBB....",".BBBBBBBBBBBB...","BBBBBBBBBBBBBB..","BBBBBBBBBBBBBB..",
  "................","................","................","................",
];
const PIPE_TOP = [
  "..GGGGGGGGGG....",".GGGGGGGGGGGG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GGGGGGGGGGGG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
];
const PIPE_BODY = [
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
  ".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",".GgGGGGGGGGgG...",
];
const BRICK = [
  "OOOOOOOO","OoOoOoOo","OOOOOOOO","oOoOoOoO",
  "OOOOOOOO","OoOoOoOo","OOOOOOOO","oOoOoOoO",
];
const QBLOCK = [
  "YYYYYYYY","YOOOOOOY","YOYYYYOY","YOYYYYOY",
  "YOOOYYOY","YOOOOOOY","YOOOYYYY","YYYYYYYY",
];
const QBLOCK_USED = [
  "oooooooo","oOOOOOOo","oOooooOo","oOooooOo",
  "oOOOooOo","oOOOOOOo","oOOOoooo","oooooooo",
];
const COIN1 = [
  "..YYYY..",".YYYYYY.","YYY..YYY","YY....YY",
  "YY....YY","YYY..YYY",".YYYYYY.","..YYYY..",
];
const COIN2 = [
  "...YY...","..YYYY..","..Y..Y..","..Y..Y..",
  "..Y..Y..","..Y..Y..","..YYYY..","...YY...",
];
const MUSHROOM = [
  "..RRRR..",".RRRRRR.","RRWWRRWW","RWWRRWWR",
  "RRRRRRRR","RRRRRRRR",".SSSSSS.",".S.SS.S.",
];
const FLAG = [
  "..TTTT..","..TttT..","..TttT..","..TttT..","..TttT..","..TttT..",
  "..TttT..","..TttT..","..TttT..","..TttT..","..TttT..","..TttT..",
  "..TttT..","..TttT..","..TttT..","..TttT..",
];
const CLOUD = [
  "................",".....WWWW.......","...WWWWWWWW.....","..WWWWWWWWWW....",
  ".WWWWWWWWWWWW...","WWWWWWWWWWWWWW..","WWWWWWWWWWWWWW..","................",
];
const HILL = [
  "......GGGG......","....GGGGGGGG....","..GGGGGGGGGGGG..",".GGGGGGGGGGGGGG.",
  "GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGG",
];
const BUSH = [
  "................","....GGGGGG......","..GGGGGGGGGG....",".GGGGGGGGGGGG...",
  "GGGGGGGGGGGGGG..","GGGGGGGGGGGGGG..",
];
const CASTLE = [
  "..BBBBBBBBBBBB..",".BBBBBBBBBBBBBB.","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
  "BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
  "BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB","BBBBBBBBBBBBBBBB",
];

const LEVEL = [
  ["ground", 0, 2000],
  ["cloud", 20, 10], ["cloud", 90, 10], ["cloud", 160, 10],
  ["cloud", 250, 10], ["cloud", 340, 10], ["cloud", 430, 10],
  ["cloud", 520, 10], ["cloud", 610, 10],
  ["hill", 30, GROUND_Y - 8], ["hill", 200, GROUND_Y - 8],
  ["hill", 400, GROUND_Y - 8], ["hill", 600, GROUND_Y - 8],
  ["bush", 70, GROUND_Y - 6], ["bush", 260, GROUND_Y - 6],
  ["bush", 500, GROUND_Y - 6], ["bush", 700, GROUND_Y - 6],
  ["qblock", 16, GROUND_Y - 32],
  ["brick", 24, GROUND_Y - 32],
  ["qblock", 32, GROUND_Y - 32],
  ["brick", 40, GROUND_Y - 32],
  ["qblock", 48, GROUND_Y - 32],
  ["brick", 56, GROUND_Y - 32],
  ["brick", 80, GROUND_Y - 64],
  ["qblock", 88, GROUND_Y - 64],
  ["brick", 96, GROUND_Y - 64],
  ["pipe", 110, GROUND_Y - 16],
  ["pipe", 150, GROUND_Y - 32],
  ["pipe", 200, GROUND_Y - 16],
  ["pipe", 260, GROUND_Y - 48],
  ["goomba", 70, GROUND_Y - 10],
  ["goomba", 130, GROUND_Y - 10],
  ["goomba", 180, GROUND_Y - 10],
  ["goomba", 240, GROUND_Y - 10],
  ["goomba", 300, GROUND_Y - 10],
  ["goomba", 360, GROUND_Y - 10],
  ["coin", 26, GROUND_Y - 48],
  ["coin", 34, GROUND_Y - 48],
  ["coin", 42, GROUND_Y - 48],
  ["coin", 82, GROUND_Y - 80],
  ["coin", 90, GROUND_Y - 80],
  ["coin", 98, GROUND_Y - 80],
  ["coin", 320, GROUND_Y - 48],
  ["coin", 328, GROUND_Y - 48],
  ["coin", 336, GROUND_Y - 48],
  ["mushroom", 32, GROUND_Y - 32],
  ["brick", 380, GROUND_Y - 32],
  ["qblock", 388, GROUND_Y - 32],
  ["brick", 396, GROUND_Y - 32],
  ["brick", 404, GROUND_Y - 64],
  ["qblock", 412, GROUND_Y - 64],
  ["brick", 420, GROUND_Y - 64],
  ["goomba", 440, GROUND_Y - 10],
  ["goomba", 480, GROUND_Y - 10],
  ["brick", 520, GROUND_Y - 32],
  ["brick", 528, GROUND_Y - 32],
  ["brick", 536, GROUND_Y - 32],
  ["brick", 544, GROUND_Y - 32],
  ["brick", 552, GROUND_Y - 32],
  ["brick", 560, GROUND_Y - 32],
  ["brick", 568, GROUND_Y - 32],
  ["brick", 576, GROUND_Y - 32],
  ["flag", 640, GROUND_Y - 96],
  ["castle", 680, GROUND_Y - 48],
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.max(1, Math.min(
    Math.floor(window.innerWidth / VIEW_W),
    Math.floor(window.innerHeight / VIEW_H)
  ));
  canvas.width = VIEW_W * scale;
  canvas.height = VIEW_H * scale;
  ctx.imageSmoothingEnabled = false;
  ctx.scale(scale, scale);
}
window.addEventListener('resize', resize);

let keys = {};
let mario, camera_x, game_state, score, coins, lives, time_left, jump_timer;
let goomba_state, coin_state, block_state, mushroom_state;
let frame = 0;

function reset() {
  mario = {
    x: 20, y: GROUND_Y - 16, vx: 0, vy: 0,
    on_ground: true, big: false, facing: 1, invincible: 0,
  };
  camera_x = 0;
  game_state = 'playing';
  score = 0;
  coins = 0;
  lives = 3;
  time_left = 400;
  jump_timer = 0;
  goomba_state = {};
  coin_state = {};
  block_state = {};
  mushroom_state = {};
  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind === 'goomba') goomba_state[ix + ',' + iy] = { alive: true, vx: -0.4, flat: 0 };
    if (kind === 'coin') coin_state[ix + ',' + iy] = true;
    if (kind === 'brick' || kind === 'qblock') block_state[ix + ',' + iy] = { used: false, bump: 0 };
    if (kind === 'mushroom') mushroom_state[ix + ',' + iy] = { active: false, vx: 0.8, vy: 0, y: iy };
  }
}

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'Space', 'KeyW'].includes(e.code) && mario.on_ground) {
    mario.vy = JUMP_POWER;
    mario.on_ground = false;
    jump_timer = 0;
  }
  if (e.code === 'KeyR') reset();
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnJump = document.getElementById('btn-jump');
let touchLeft = false, touchRight = false, touchJump = false;
function bindTouch(el, on, off) {
  el.addEventListener('touchstart', e => { e.preventDefault(); on(); });
  el.addEventListener('touchend', e => { e.preventDefault(); off(); });
  el.addEventListener('mousedown', e => { e.preventDefault(); on(); });
  el.addEventListener('mouseup', e => { e.preventDefault(); off(); });
}
bindTouch(btnLeft, () => touchLeft = true, () => touchLeft = false);
bindTouch(btnRight, () => touchRight = true, () => touchRight = false);
bindTouch(btnJump, () => {
  touchJump = true;
  if (mario.on_ground) {
    mario.vy = JUMP_POWER;
    mario.on_ground = false;
    jump_timer = 0;
  }
}, () => touchJump = false);

function drawSprite(sprite, x, y) {
  for (let r = 0; r < sprite.length; r++) {
    for (let c = 0; c < sprite[r].length; c++) {
      const ch = sprite[r][c];
      const col = COLORS[ch];
      if (col) {
        const sx = (x + c - camera_x) * PIXEL;
        const sy = (y + r) * PIXEL;
        if (sx > -PIXEL && sx < canvas.width && sy > -PIXEL && sy < canvas.height) {
          ctx.fillStyle = col;
          ctx.fillRect(sx, sy, PIXEL, PIXEL);
        }
      }
    }
  }
}

function drawRect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect((x - camera_x) * PIXEL, y * PIXEL, w * PIXEL, h * PIXEL);
}

function updateMario() {
  const m = mario;
  let ax = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || touchLeft) { ax = -RUN_ACCEL; m.facing = -1; }
  if (keys['ArrowRight'] || keys['KeyD'] || touchRight) { ax = RUN_ACCEL; m.facing = 1; }
  m.vx += ax;
  if (ax === 0) {
    m.vx *= FRICTION;
    if (Math.abs(m.vx) < 0.05) m.vx = 0;
  }
  m.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, m.vx));

  if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW'] || touchJump) && !m.on_ground) {
    if (jump_timer < JUMP_HOLD_FRAMES) {
      m.vy -= JUMP_HOLD_BOOST;
      jump_timer++;
    }
  }

  m.x += m.vx;
  m.vy = Math.min(m.vy + GRAVITY, MAX_FALL);
  m.y += m.vy;

  const mh = m.big ? 24 : 16;
  const mw = 14;

  if (m.y >= GROUND_Y - mh) {
    m.y = GROUND_Y - mh;
    m.vy = 0;
    m.on_ground = true;
  }

  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind !== 'brick' && kind !== 'qblock') continue;
    if (m.x + mw > ix && m.x < ix + 8) {
      if (m.y + mh > iy && m.y + mh < iy + 14 && m.vy > 0) {
        m.y = iy - mh; m.vy = 0; m.on_ground = true;
      } else if (m.y < iy + 8 && m.y > iy - 4 && m.vy < 0) {
        m.y = iy + 8; m.vy = 0;
        const b = block_state[ix + ',' + iy];
        if (kind === 'qblock' && !b.used) {
          b.used = true; b.bump = 8;
          for (const mm of LEVEL) {
            if (mm[0] === 'mushroom' && mm[1] === ix) {
              mushroom_state[mm[1] + ',' + mm[2]].active = true;
              mushroom_state[mm[1] + ',' + mm[2]].vy = -2;
            }
          }
          score += 200;
        } else if (kind === 'brick') {
          b.bump = 8; score += 50;
        }
      }
    }
  }

  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind !== 'pipe') continue;
    if (m.x + mw > ix + 1 && m.x < ix + 13) {
      if (m.y + mh > iy && m.y + mh < iy + 8 && m.vy > 0) {
        m.y = iy - mh; m.vy = 0; m.on_ground = true;
      } else if (m.y + mh > iy + 4) {
        if (m.vx > 0) m.x = ix - mw;
        else if (m.vx < 0) m.x = ix + 14;
        m.vx = 0;
      }
    }
  }
}

function updateGoombas() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind !== 'goomba') continue;
    const g = goomba_state[ix + ',' + iy];
    if (!g.alive) { if (g.flat > 0) g.flat--; continue; }
    const gx = ix + g.vx;
    if (m.x + mw > gx && m.x < gx + 14 && m.y + mh > iy && m.y < iy + 14) {
      if (m.vy > 0 && m.y + mh < iy + 10) {
        g.alive = false; g.flat = 30;
        m.vy = -5; score += 100;
      } else {
        if (m.invincible <= 0) {
          if (m.big) { m.big = false; m.y += 8; m.invincible = 90; }
          else game_state = 'dead';
        }
      }
    }
  }
}

function updateCoins() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind !== 'coin') continue;
    if (!coin_state[ix + ',' + iy]) continue;
    if (m.x + mw > ix && m.x < ix + 8 && m.y + mh > iy && m.y < iy + 8) {
      coin_state[ix + ',' + iy] = false;
      coins++; score += 200;
    }
  }
}

function updateMushroom() {
  const m = mario;
  const mh = m.big ? 24 : 16;
  const mw = 14;
  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind !== 'mushroom') continue;
    const mu = mushroom_state[ix + ',' + iy];
    if (!mu.active) continue;
    mu.vy = Math.min(mu.vy + GRAVITY, MAX_FALL);
    mu.y += mu.vy;
    if (mu.y >= GROUND_Y - 8) { mu.y = GROUND_Y - 8; mu.vy = 0; }
    const mx = ix + mu.vx;
    if (m.x + mw > mx && m.x < mx + 8 && m.y + mh > mu.y && m.y < mu.y + 8) {
      mu.active = false;
      if (!m.big) { m.big = true; m.y -= 8; }
      score += 1000;
    }
  }
}

function checkFlag() {
  for (const item of LEVEL) {
    if (item[0] === 'flag' && mario.x + 14 > item[1] + 2) {
      game_state = 'win';
    }
  }
}

function render() {
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const item of LEVEL) if (item[0] === 'cloud') drawSprite(CLOUD, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === 'hill') drawSprite(HILL, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === 'bush') drawSprite(BUSH, item[1], item[2]);

  drawRect(0, GROUND_Y, VIEW_W + 40, VIEW_H - GROUND_Y, '#e39d25');
  drawRect(0, GROUND_Y, VIEW_W + 40, 2, '#a86b1a');

  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind === 'brick') {
      const b = block_state[ix + ',' + iy];
      drawSprite(BRICK, ix, iy - b.bump);
      if (b.bump > 0) b.bump--;
    } else if (kind === 'qblock') {
      const b = block_state[ix + ',' + iy];
      drawSprite(b.used ? QBLOCK_USED : QBLOCK, ix, iy - b.bump);
      if (b.bump > 0) b.bump--;
    }
  }

  for (const item of LEVEL) {
    if (item[0] === 'pipe') {
      const ix = item[1], iy = item[2];
      drawSprite(PIPE_TOP, ix, iy);
      let by = iy + 16;
      while (by < GROUND_Y) { drawSprite(PIPE_BODY, ix, by); by += 16; }
    }
  }

  const f = frame;
  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind === 'coin' && coin_state[ix + ',' + iy]) {
      drawSprite((Math.floor(f / 8) % 2 === 0) ? COIN1 : COIN2, ix, iy);
    }
  }

  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind === 'mushroom') {
      const mu = mushroom_state[ix + ',' + iy];
      if (mu.active) drawSprite(MUSHROOM, ix + mu.vx, mu.y);
    }
  }

  for (const item of LEVEL) if (item[0] === 'flag') drawSprite(FLAG, item[1], item[2]);
  for (const item of LEVEL) if (item[0] === 'castle') drawSprite(CASTLE, item[1], item[2]);

  for (const item of LEVEL) {
    const [kind, ix, iy] = item;
    if (kind === 'goomba') {
      const g = goomba_state[ix + ',' + iy];
      if (g.alive) {
        drawSprite((Math.floor(f / 8) % 2 === 0) ? GOOMBA1 : GOOMBA2, ix + g.vx, iy);
      } else if (g.flat > 0) {
        drawSprite(GOOMBA_FLAT, ix, iy);
      }
    }
  }

  const m = mario;
  if (!(m.invincible > 0 && Math.floor(f / 4) % 2 === 0)) {
    let spr;
    if (!m.on_ground) spr = MS_JUMP;
    else if (Math.abs(m.vx) > 0.3) spr = (Math.floor(f / 4) % 2 === 0) ? MS_RUN1 : MS_RUN2;
    else spr = MS_IDLE;
    drawSprite(spr, m.x, m.y);
  }

  ctx.fillStyle = 'white';
  ctx.font = 'bold 10px Consolas';
  ctx.textAlign = 'left';
  ctx.fillText(`MARIO ${String(score).padStart(6, '0')}  x${String(coins).padStart(2, '0')}  TIME ${String(time_left).padStart(3, '0')}`, 6, 12);

  if (game_state === 'win') {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Consolas';
    ctx.fillText('COURSE CLEAR!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = 'bold 12px Consolas';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`SCORE: ${score}  COINS: ${coins}`, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillStyle = 'white';
    ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 35);
  } else if (game_state === 'dead') {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Consolas';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    ctx.font = 'bold 12px Consolas';
    ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 30);
  }
}

let lastTime = 0;
let accumulator = 0;
const STEP = 1 / FPS;

function loop(t) {
  const dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt < 1) {
    accumulator += dt;
    while (accumulator >= STEP) {
      if (game_state === 'playing') {
        updateMario();
        updateGoombas();
        updateCoins();
        updateMushroom();
        checkFlag();
        if (mario.invincible > 0) mario.invincible--;
        if (mario.y > VIEW_H + 50) game_state = 'dead';
        const target = mario.x - VIEW_W * 0.4;
        camera_x += (target - camera_x) * 0.15;
        camera_x = Math.max(0, camera_x);
        if (frame % 60 === 0 && time_left > 0) time_left--;
        frame++;
      }
      accumulator -= STEP;
    }
  }
  render();
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
